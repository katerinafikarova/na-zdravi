<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kompilace rozpoznávacího cíle</title></head>
<body style="margin:0;background:#0a2618;color:#f3ead3;font:16px/1.5 system-ui,sans-serif"><div style="max-width:560px;margin:0 auto;padding:32px 20px;display:flex;flex-direction:column;gap:14px">
<h1 style="margin:0;font-size:26px">Kompilace cíle pro WebAR</h1>
<p style="margin:0;opacity:.85">Vygeneruje soubor <b>target.mind</b> z grafiky <code>assets/ar2/target.jpg</code>. Stažený soubor nahrajte do složky <code>assets/ar2/</code>; aplikace ho pak načte hned a nemusí cíl připravovat v telefonu.</p>
<button id="go" style="height:52px;border:0;border-radius:12px;background:#f3ead3;color:#0a2618;font:600 16px system-ui;cursor:pointer">Zkompilovat</button>
<div id="s" style="font-family:monospace"></div><a id="dl" style="color:#f3ead3;display:none" download="target.mind">Stáhnout target.mind</a></div>
<script type="module">
const s=document.getElementById('s');
document.getElementById('go').onclick=async()=>{try{
s.textContent='Načítám knihovnu…';
await import('https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js');
const src=new Image(); src.src='assets/ar2/target.jpg'; await src.decode();
const W=src.naturalWidth,H=src.naturalHeight; const c=document.createElement('canvas'); c.width=W;c.height=H; c.getContext('2d').drawImage(src,0,0,W,H);
const img=new Image(); img.src=c.toDataURL(); await img.decode();
const comp=new MINDAR.IMAGE.Compiler();
await comp.compileImageTargets([img],p=>s.textContent='Kompiluji… '+p.toFixed(0)+' %');
const d=comp.exportData(); const a=document.getElementById('dl'); a.href=URL.createObjectURL(new Blob([d])); a.style.display='block';
s.textContent='Hotovo ('+Math.round(d.byteLength/1024)+' kB).';
}catch(e){s.textContent='Chyba: '+e.message}};
</script></body></html>
